; Weakness Tracker settings. Restart the game after editing this file.

; Shows neutral elements in the enemy Affinities panel. false leaves the panel exactly as
; the game ships it.
NeutralRow = true

; Neutral elements you have not tried yet. false hides them, so the panel only lists what you
; have tried. true shows them as "?", like the game does for unrevealed weaknesses.
ShowUntested = false

; true writes each neutral panel entry to UE4SS.log (for testing). Normal play: false
Debug = false
